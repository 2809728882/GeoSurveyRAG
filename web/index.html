<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoSurveyRAG</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>GeoSurveyRAG</h1>
            <p>搜索资料 -> 爬虫入库 -> 自动更新索引 -> RAG 问答</p>
          </div>
          <button id="statusBtn" title="查看索引状态">索引状态</button>
        </header>

        <section class="panel">
          <h2>1. 输入问题</h2>
          <textarea id="question" rows="5">无人机航测成果入库前需要检查哪些质量项？请按检查清单回答。</textarea>
          <div class="button-row">
            <button class="primary" id="askBtn">直接问当前知识库</button>
          </div>
        </section>

        <section class="panel">
          <h2>2. 粘贴你搜索到的资料 URL</h2>
          <textarea id="crawlUrls" rows="5" placeholder="每行一个 URL，例如：https://epsg.io/3857"></textarea>
          <div class="button-row">
            <button id="crawlBtn">只爬取并更新知识库</button>
            <button class="primary" id="crawlAskBtn">爬取更新后再回答</button>
          </div>
          <p class="hint">适合你先在浏览器里搜索资料，再把可靠页面 URL 粘贴进来，由系统爬取、入库、重建索引并回答。</p>
        </section>

        <section class="panel">
          <h2>3. 手动补充知识</h2>
          <input id="manualTitle" placeholder="标题，例如：RTK 固定解检查规则" />
          <textarea id="manualContent" rows="4" placeholder="粘贴项目经验、质检规则、作业指导书摘要等内容"></textarea>
          <div class="button-row">
            <button id="manualBtn">手动入库并更新索引</button>
          </div>
        </section>

        <section class="panel">
          <h2>爬虫来源管理</h2>
          <input id="sourceName" placeholder="来源名称，例如：EPSG 4490 CGCS2000" />
          <input id="sourceUrl" placeholder="来源 URL，例如：https://epsg.io/4490" />
          <div class="button-row">
            <button id="addSourceBtn">添加来源</button>
            <button id="listSourcesBtn">查看默认来源</button>
          </div>
        </section>
      </section>

      <aside class="result-panel">
        <div class="panel-head">
          <h2>回答与更新结果</h2>
          <span id="runtimeState">DeepSeek / OpenAI-compatible</span>
        </div>
        <div class="answer" id="answer">等待提问或知识库更新。</div>
        <div class="sources" id="sources"></div>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
