name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            backend: json
          - os: ubuntu-latest
            python: "3.12"
            backend: faiss
          - os: windows-latest
            python: "3.12"
            backend: faiss
    runs-on: ${{ matrix.os }}
    env:
      VECTOR_BACKEND: ${{ matrix.backend }}
      LLM_PROVIDER: local
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,faiss]"
      - name: Check Python errors
        run: ruff check --isolated --select E4,E7,E9,F src tests
      - name: Build sample index
        run: python -m geosurvey_rag.ingestion --source data/knowledge --index data/index
      - name: Run tests
        run: pytest -q --junitxml=test-results.xml
      - name: Run reproducible offline evaluation
        run: python -m geosurvey_rag.evaluation --report evaluation.md --json evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.backend }}
          path: |
            test-results.xml
            evaluation.md
            evaluation.json
