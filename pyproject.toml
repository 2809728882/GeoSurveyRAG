[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosurvey-rag"
version = "0.1.0"
description = "RAG and tool-calling assistant for surveying, WebGIS and geospatial engineering workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wu Fayin" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "pyproj>=3.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
llm = ["langchain>=0.3.0", "llama-index>=0.11.0", "faiss-cpu>=1.8.0", "numpy>=1.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
